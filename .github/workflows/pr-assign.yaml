name: pr-assign

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: kentaro-m/auto-assign-action@v2
      - name: Request coredev review
        env:
          GH_TOKEN: ${{ secrets.MEOWBLECOIN_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          gh api --method POST
          "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers"
          -f 'team_reviewers[]=coredev'
