name: Pin SGX headers
description: Pins libsgx-headers to the version compatible with DCAP 1.22

runs:
  using: composite
  steps:
    - name: Pin libsgx-headers
      shell: bash
      run: |
        # DCAP 1.22's development packages allow libsgx-headers >= 2.25, so
        # APT otherwise selects newer headers that conflict with DCAP < 1.26.
        # Remove this pin after upgrading DCAP to 1.26 or newer.
        sudo tee /etc/apt/preferences.d/libsgx-headers >/dev/null <<'EOF'
        Package: libsgx-headers
        Pin: version 2.25.100.3-noble1
        Pin-Priority: 1001
        EOF
