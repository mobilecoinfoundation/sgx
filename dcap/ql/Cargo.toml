[package]
name = "mc-sgx-dcap-ql"
version = "0.13.0"
edition = "2021"
authors = ["MobileCoin"]
rust-version = "1.99.0"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mobilecoinfoundation/sgx"
description = "Rust wrappers for the `sgx_dcap_ql` library."

categories = ["api-bindings", "hardware-support"]
keywords = ["sgx"]

[features]
default = []

# Used to prevent tests from running in sim environments
sim = []

[dependencies]
displaydoc = { version = "0.2", default-features = false }
mc-sgx-core-sys-types = { path = "../../core/sys/types", version = "=0.13.0" }
mc-sgx-core-types = { path = "../../core/types", version = "=0.13.0" }
mc-sgx-dcap-ql-sys = { path = "sys", version = "=0.13.0" }
mc-sgx-dcap-ql-types = { path = "types", version = "=0.13.0" }
mc-sgx-dcap-types = { path = "../types", version = "=0.13.0", features = ["alloc"] }
mc-sgx-util = { path = "../../util", version = "=0.13.0" }
once_cell = "1"

[dev-dependencies]
serial_test = { version = "4", default-features = false }
tempfile = "3"
yare = "3"
